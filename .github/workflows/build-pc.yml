name: Build PC exe
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: En son yuklenen kaynak zipini bul ve ac
        shell: bash
        run: |
          set -e
          ZIP=$(git log --name-only --pretty=format: -n 50 \
                | grep -iE '^.*altyazi-src.*\.zip$' \
                | head -n 1 || true)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(ls -t *altyazi-src*.zip 2>/dev/null | head -n 1)
          fi
          echo "Kullanilan kaynak: $ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          ls project/pc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install pyinstaller mss numpy rapidocr-onnxruntime

      - name: Derle
        run: >
          pyinstaller --onefile --noconsole --name LingoPlay
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          project/pc/lingoplay_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: lingoplay-pc
          path: dist/LingoPlay.exe
          if-no-files-found: error
