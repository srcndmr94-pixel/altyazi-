name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: En son yuklenen kaynak zipini bul ve ac
        shell: bash
        run: |
          set -e
          # Adi ne olursa olsun, en son commit edilen kaynak zipini seciyoruz.
          ZIP=$(git log --name-only --pretty=format: -n 50 \
                | grep -iE '^.*altyazi-src.*\.zip$' \
                | head -n 1 || true)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(ls -t *altyazi-src*.zip 2>/dev/null | head -n 1)
          fi
          echo "Kullanilan kaynak: $ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          ls project

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Derle
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: altyazi-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
